name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36'
          echo "ANDROID_HOME=$SDK_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate offline voice-lab scripts
        run: python3 -m py_compile tools/prepare_voice_references.py tools/try_chatterbox_v3.py
      - name: Stage offline neural runtime and Russian model
        run: bash tools/stage_android_neural_tts.sh
      - name: Unit tests and assemble debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
